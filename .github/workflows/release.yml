name: Release-pipeline

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Get the version from the github tag ref
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: latest

      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        env:
          VITE_UI_VERSION: ${{ steps.get_version.outputs.VERSION }}
          VITE_ANALYTICS_SERVER_URL: https://analytics.zenml.io/batch

      - name: Create release archive
        run: |
          tar -zcf kitaru-ui.tar.gz -C dist --transform="s#\.\/##" .
          sha256sum -b kitaru-ui.tar.gz > kitaru-ui.tar.gz.sha256

      - name: Release to GitHub
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: |
            kitaru-ui.tar.gz
            kitaru-ui.tar.gz.sha256
          body_path: ./CHANGELOG.md
          prerelease: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
