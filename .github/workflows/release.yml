name: Release-pipeline

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Get the version from the github tag ref
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest

      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        env:
          VITE_UI_VERSION: ${{ steps.get_version.outputs.VERSION }}
          VITE_ANALYTICS_SERVER_URL: https://analytics.zenml.io/batch

      - name: Create release archive
        run: |
          tar -zcf kitaru-ui.tar.gz -C dist --transform="s#\.\/##" .
          sha256sum -b kitaru-ui.tar.gz > kitaru-ui.tar.gz.sha256

      - name: Release to GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            kitaru-ui.tar.gz
            kitaru-ui.tar.gz.sha256
          body_path: ./CHANGELOG.md
          prerelease: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
