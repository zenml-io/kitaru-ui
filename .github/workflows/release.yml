name: Release-pipeline

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Get the version from the github tag ref
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        env:
          VITE_UI_VERSION: ${{ steps.get_version.outputs.VERSION }}
          VITE_ANALYTICS_SERVER_URL: https://analytics.zenml.io/batch

      - name: Create release archive
        run: |
          tar -zcf kitaru-ui.tar.gz -C dist --transform="s#\.\/##" .
          sha256sum -b kitaru-ui.tar.gz > kitaru-ui.tar.gz.sha256

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kitaru-ui.tar.gz
            kitaru-ui.tar.gz.sha256
          body_path: ./CHANGELOG.md
          prerelease: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
